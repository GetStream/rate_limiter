name: Dart CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Install Dependencies
        run: dart pub get
      - name: Format
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: dart analyze --fatal-infos
      - name: Run tests
        run: dart test --coverage=coverage
      # `--base-directory` keeps the paths in lcov.info repo-relative, otherwise
      # Codecov cannot map them back to the files in the repo.
      - name: Format coverage
        run: >
          dart run coverage:format_coverage --lcov --in=coverage
          --out=coverage/lcov.info --report-on=lib --base-directory=.
      - name: Check Code Coverage
        uses: VeryGoodOpenSource/very_good_coverage@v3
        with:
          min_coverage: 97
          path: "./coverage/lcov.info"
      - name: Report CodeCov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
