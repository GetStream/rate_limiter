name: pub_publish

on:
  push:
    tags:
      # Must stay in sync with the tag pattern configured for automated
      # publishing on pub.dev — it is matched against the OIDC token, so a tag
      # this pattern accepts but pub.dev does not would fail at the publish
      # step. Releases up to 1.0.0 were tagged without the `v` prefix; from
      # here on they need it.
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

jobs:
  publish:
    permissions:
      contents: read
      id-token: write # Required for authentication using OIDC
    runs-on: ubuntu-latest
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v7

      - name: 🎯 Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: 📦 Install Dependencies
        run: dart pub get

      - name: 🌵 Dry Run
        run: dart pub publish --dry-run

      - name: 📢 Publish
        run: dart pub publish --force
